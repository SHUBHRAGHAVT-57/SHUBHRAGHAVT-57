name: Refresh profile assets

on:
  schedule:
    - cron: '19 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/profile.mjs
      - scripts/update-stats.mjs
      - scripts/build-hero.mjs
      - scripts/prepare-snake.mjs
      - .github/workflows/profile-assets.yml

permissions:
  contents: read

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'SHUBHRAGHAVT-57/SHUBHRAGHAVT-57' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Generate hero and public statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/build-hero.mjs
          node scripts/update-stats.mjs
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3, node24
        with:
          github_user_name: SHUBHRAGHAVT-57
          outputs: |
            assets/snake-light.svg?color_snake=#7950b8&color_dots=#eeeaf5,#d9c9f3,#b396e0,#8d67c3,#684293
            assets/snake-dark.svg?palette=github-dark&color_snake=#d5b9ff&color_dots=#20192e,#44325f,#73539b,#a478d1,#d5b9ff
      - name: Prepare accessible assets and validate
        run: |
          node scripts/prepare-snake.mjs
          node --test scripts/profile.test.mjs
          node scripts/check-profile.mjs
      - name: Commit changed assets only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add README.md assets/hero.svg assets/hero-mobile.svg assets/stats-dark.svg assets/stats-light.svg assets/snake-dark.svg assets/snake-light.svg assets/contributions-dark.svg assets/contributions-light.svg data/public-profile.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public profile assets'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
