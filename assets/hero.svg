<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Shubh Raghav · Software Developer</title>
<desc id="desc">Architecting ideas. Engineering experiences. Electric violet light trails and an animated geometric SR monogram. Motion stops when reduced motion is preferred.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2=".5"><stop stop-color="#100b1c"/><stop offset=".56" stop-color="#281047"/><stop offset="1" stop-color="#56218a"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#a864f3" stop-opacity=".35"/><stop offset="1" stop-color="#a864f3" stop-opacity="0"/></radialGradient>
 <linearGradient id="ink" x2="1" y2="1"><stop stop-color="#f0e3ff"/><stop offset="1" stop-color="#b68aff"/></linearGradient>
 <linearGradient id="line"><stop stop-color="#a67bff" stop-opacity="0"/><stop offset=".5" stop-color="#dbb9ff"/><stop offset="1" stop-color="#a67bff" stop-opacity="0"/></linearGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#dec7ff" stroke-opacity=".06"/></pattern>
</defs>
<style>
.orbit{stroke-dasharray:3 17;animation:orbit 36s linear infinite;transform-origin:150px 150px}
.signal{stroke-dasharray:80 1100;animation:signal 12s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes signal{to{stroke-dashoffset:-1180}}
@media(prefers-reduced-motion:reduce){.orbit,.signal{animation:none}}
</style>
<rect width="1200" height="360" rx="18" fill="url(#bg)"/>
<rect width="1200" height="360" rx="18" fill="url(#grid)"/>
<ellipse cx="1020" cy="180" rx="600" ry="360" fill="url(#glow)"/>
<path d="M480 405Q816.0000000000001 158.4 1250 45" fill="none" stroke="#d6b6ff" stroke-opacity="0.05"/><path d="M504 405Q827.0000000000001 158.4 1250 75" fill="none" stroke="#d6b6ff" stroke-opacity="0.064"/><path d="M528 405Q838.0000000000001 158.4 1250 105" fill="none" stroke="#d6b6ff" stroke-opacity="0.078"/><path d="M552 405Q849.0000000000001 158.4 1250 135" fill="none" stroke="#d6b6ff" stroke-opacity="0.092"/><path d="M576 405Q860.0000000000001 158.4 1250 165" fill="none" stroke="#d6b6ff" stroke-opacity="0.10600000000000001"/><path d="M600 405Q871.0000000000001 158.4 1250 195" fill="none" stroke="#d6b6ff" stroke-opacity="0.12000000000000001"/><path d="M624 405Q882.0000000000001 158.4 1250 225" fill="none" stroke="#d6b6ff" stroke-opacity="0.134"/>
<path class="signal" d="M0 359Q600 358 1200 125.99999999999999" fill="none" stroke="url(#line)" stroke-width="2"/>
<rect x=".5" y=".5" width="1199" height="359" rx="18" fill="none" stroke="#9d6ace" stroke-opacity=".45"/>
<g transform="translate(920 29) scale(.8)" fill="none">
 <circle cx="150" cy="150" r="143" stroke="#dec4ff" stroke-opacity=".16"/>
 <circle class="orbit" cx="150" cy="150" r="124" stroke="#dfbfff" stroke-opacity=".5"/>
 <path d="M205 72H112L65 150H166L120 228H212M199 72L246 150L199 228M166 150H246" stroke="url(#ink)" stroke-width="16" stroke-linejoin="bevel"/>
 <circle cx="150" cy="7" r="4" fill="#efdbff"/>
</g>
<g font-family="Arial, Helvetica, sans-serif">
 <text x="58" y="58" fill="#e3c7ff" font-size="17" letter-spacing="3">SOFTWARE DEVELOPER</text>
 <path d="M58 90h46" stroke="#d5a7ff" stroke-width="3"/>
 <text x="55" y="184" fill="#ffffff" font-weight="700" font-size="90" letter-spacing="-3">SHUBH RAGHAV</text>

 <text x="58" y="242" fill="#e7d7f6" font-size="26">Architecting ideas.</text>
 <text x="300" y="242" fill="#e7d7f6" font-size="26">Engineering experiences.</text>
 <text x="58" y="326" fill="#d8c1ed" font-size="17" letter-spacing="3">BUILD / REFINE / REPEAT</text>
</g>
</svg>
